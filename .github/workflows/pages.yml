name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/configure-pages@v6
      - run: pip install -r requirements-docs.txt
      - name: Check manual validators
        run: python3 -m unittest discover -s scripts/tests -p 'test_manual*.py'
      - name: Check math HTML escaping
        run: python3 -m unittest discover -s scripts/tests -p 'test_math*.py'
      - name: Check citation URL metadata
        run: python3 scripts/verify_citations.py --offline
      - name: Build
        run: python3 scripts/build_site.py --strict
      - name: Check rendered manual links and search
        run: python3 scripts/check_manual.py --site _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
