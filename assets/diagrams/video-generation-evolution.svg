<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
<title id="title">视频生成：从显式模拟到可交互 World Model</title><desc id="desc">视频生成技术演化图，展示九个关键阶段和三类能力向 World Model 的回流。</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17223b" flood-opacity=".1"/></filter><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#547fc5"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#7d62be"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#228963"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.nodeTitle{font-size:17px;font-weight:700;fill:#17223b}.nodeSub{font-size:15px;fill:#475467}.era{font-size:19px;font-weight:700}.arrow{fill:none;stroke-width:3}.return{fill:none;stroke-width:2.5;stroke-dasharray:8 7}</style></defs>
<rect width="1800" height="900" rx="24" fill="#f7f8fc"/><text x="80" y="95" font-size="36" font-weight="700" fill="#17223b">视频生成：从显式模拟到可交互 World Model</text><text x="82" y="134" font-size="18" fill="#667085">表示学习不断抽象，生成规模持续扩大，最终重新汇入状态、动作与物理约束</text>
<rect x="60" y="170" width="560" height="360" rx="22" fill="#eaf2ff"/><rect x="640" y="170" width="740" height="360" rx="22" fill="#f1edff"/><rect x="1400" y="170" width="340" height="360" rx="22" fill="#e8f8f1"/><text class="era" x="84" y="216" fill="#2457a7">01  建模与预测</text><text class="era" x="664" y="216" fill="#6a46b8">02  生成与规模化</text><text class="era" x="1424" y="216" fill="#177a59">03  交互与世界建模</text>
<g class="arrow" marker-end="url(#blue)" stroke="#547fc5"><path d="M240 335h28"/><path d="M420 335h28"/></g><g class="arrow" marker-end="url(#purple)" stroke="#7d62be"><path d="M600 335h68"/><path d="M820 335h28"/><path d="M1000 335h28"/><path d="M1180 335h28"/></g><path class="arrow" d="M1360 335h68" stroke="#318e6c" marker-end="url(#green)"/><path class="arrow" d="M1555 335h23" stroke="#228963" marker-end="url(#green)"/>
<g filter="url(#s)" text-anchor="middle"><g><rect x="90" y="285" width="150" height="100" rx="15" fill="white" stroke="#85aeeb" stroke-width="2"/><text class="nodeTitle" x="165" y="326">显式图形学</text><text class="nodeSub" x="165" y="354">&amp; 物理模拟</text></g><g><rect x="270" y="285" width="150" height="100" rx="15" fill="white" stroke="#85aeeb" stroke-width="2"/><text class="nodeTitle" x="345" y="326">光流 · Warping</text><text class="nodeSub" x="345" y="354">&amp; 动态纹理</text></g><g><rect x="450" y="285" width="150" height="100" rx="15" fill="white" stroke="#85aeeb" stroke-width="2"/><text class="nodeTitle" x="525" y="326">概率状态空间</text><text class="nodeSub" x="525" y="354">latent dynamics</text></g><g><rect x="670" y="285" width="150" height="100" rx="15" fill="white" stroke="#9c83da" stroke-width="2"/><text class="nodeTitle" x="745" y="326">CNN / RNN</text><text class="nodeSub" x="745" y="354">视频预测</text></g><g><rect x="850" y="285" width="150" height="100" rx="15" fill="white" stroke="#9c83da" stroke-width="2"/><text class="nodeTitle" x="925" y="326">VAE / GAN</text><text class="nodeSub" x="925" y="354">视频生成</text></g><g><rect x="1030" y="285" width="150" height="100" rx="15" fill="white" stroke="#9c83da" stroke-width="2"/><text class="nodeTitle" x="1105" y="326">视觉 Token</text><text class="nodeSub" x="1105" y="354">+ Transformer</text></g><g><rect x="1210" y="285" width="150" height="100" rx="15" fill="white" stroke="#9c83da" stroke-width="2"/><text class="nodeTitle" x="1285" y="326">Diffusion / Flow</text><text class="nodeSub" x="1285" y="354">视频模型</text></g><g><rect x="1430" y="285" width="125" height="100" rx="15" fill="white" stroke="#56b893" stroke-width="2"/><text class="nodeTitle" x="1492" y="326">大规模视频</text><text class="nodeSub" x="1492" y="354">基础模型</text></g><g><rect x="1580" y="275" width="135" height="120" rx="15" fill="white" stroke="#28a77a" stroke-width="3"/><text class="nodeTitle" x="1647" y="317">动作条件</text><text class="nodeTitle" x="1647" y="343">与可交互</text><text x="1647" y="371" font-size="16" font-weight="700" fill="#177a59">World Model</text></g></g>
<text x="80" y="607" font-size="18" font-weight="700" fill="#344054">三种能力重新汇入</text><g text-anchor="middle"><rect x="80" y="625" width="270" height="58" rx="12" fill="white" stroke="#85aeeb"/><text x="215" y="660" font-size="15" fill="#2457a7">显式状态 · 物理约束 · 可验证性</text><rect x="380" y="625" width="240" height="58" rx="12" fill="white" stroke="#85aeeb"/><text x="500" y="660" font-size="15" fill="#2457a7">latent state + dynamics</text><rect x="650" y="625" width="285" height="58" rx="12" fill="white" stroke="#9c83da"/><text x="792" y="660" font-size="15" fill="#6a46b8">action-conditioned prediction</text></g>
<path class="return" d="M215 683v47h1330V410h33" stroke="#6390d4" marker-end="url(#blue)"/><path class="return" d="M500 683v27h1065V420h13" stroke="#6390d4" marker-end="url(#blue)"/><path class="return" d="M792 683v7h788V430" stroke="#866cc4" marker-end="url(#purple)"/>
<rect x="1030" y="760" width="710" height="84" rx="16" fill="#17223b"/><text x="1058" y="793" font-size="17" fill="white">World Model 不是单纯把视频做得更逼真，而是让模型拥有</text><text x="1058" y="821" font-size="17" font-weight="700" fill="#9fe3c8">状态、动作、记忆与可验证的动态规律。</text><text x="80" y="825" font-size="14" fill="#667085">主线表示技术重心演进；虚线表示旧能力在新范式中的回归，</text><text x="80" y="849" font-size="14" fill="#667085">并不意味着旧方法被完全替代。</text>
</svg>
